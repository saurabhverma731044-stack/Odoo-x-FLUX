<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightloop – Subscription Management</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<section id="auth" class="auth">
  <form id="authForm" class="auth-card" novalidate>
    <h1>Brightloop</h1>
    <p class="muted" id="authSub">Sign in to manage subscriptions and billing.</p>
    <label>Email<input id="email" type="email" required placeholder="you@company.com"></label>
    <label>Password<input id="pass" type="password" required placeholder="••••••••••"></label>
    <label id="roleRow">Sign in as
      <select id="role"><option value="admin">Admin</option><option value="staff">Staff</option><option value="customer">Customer</option></select></label>
    <p id="authErr" class="err" role="alert"></p>
    <button class="btn" type="submit" id="authBtn">Sign in</button>
    <p class="muted small"><a href="#" id="toggleAuth">Create an account</a> · <a href="#" id="forgot">Forgot password?</a></p>
  </form>
</section>
<div id="app" class="app" hidden>
  <nav class="rail" id="rail"></nav>
  <aside class="side"><div class="logo">Brightloop</div><div id="menu"></div></aside>
  <main class="main">
    <header class="top"><h2 id="title"></h2><div class="who"><span id="whoami"></span><button class="btn ghost" id="logout">Sign out</button></div></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
</body></html>
